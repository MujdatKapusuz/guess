
name: Cuma Sabahı Maç Güncelleme ve Analiz Döngüsü

on:
  schedule:
    # Her Cuma günü UTC saatiyle 06:00'da çalışır (Türkiye Saati ile tam 09:00 eder)
    - cron: '0 6 * * 5'
  workflow_dispatch: # İstediğiniz an GitHub panelinden elle de başlatabilmeniz için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Tahmin Motorunu Çalıştır
      env:
        FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      run: |
        python tahmin_sistemi.py
