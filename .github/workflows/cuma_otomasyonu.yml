name: Cuma Sabahı Maç Güncelleme ve Analiz Döngüsü

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas scikit-learn

    - name: Tahmin Motorunu Çalıştır
      env:
        FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      run: |
        python tahmin_sistemi.py > haftalik_rapor.txt
        cat haftalik_rapor.txt

    # GÜVENLİ VE KESİN KAYIT ADIMI
    - name: Raporu Depoya Yukle
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Haftalık tahmin raporu güncellendi [skip ci]"
        file_pattern: 'haftalik_rapor.txt'
